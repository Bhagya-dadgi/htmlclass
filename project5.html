<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="https://www.amazon.in/?ref=pd_hp_d_r_btf_unk"></form>
    <h2>Course Registation Form</h2>
    <h4>Personal Details</h4>
    <table><form action=""></form>
        <tr>
            <td><label for="">First Name</label></td>
            <td><input type="text" placeholder="Ex:Bhagya" required></td>
     </tr>
        <tr>
        <td><label for="">Last Name</label></td>
        <td><input type="text" placeholder="Ex:Dadgi" required></td>
    </tr>
    <tr>
        <td><label for="">Mobile Number</label></td>
        <td><input type="tel" placeholder="9798988788" required></td>    
    </tr>
        <tr>
            <td><label for="">Email</label></td>
            <td><input type="email" placeholder="@gmail.com" required></td>
    </tr>
        <tr>
            <td><label for="">Password</label></td>
           <td><input type="password" required></td>
    </tr>
        <tr>
            <td><label for="">Confirm Password</label></td>
            <td><input type="password" required></td>
        </tr>
        <tr>
            <td><label for="">DOB</label></td>
            <td><input type="date"></td>
    </tr>
        <tr>
            <td><label for="">AGE</label></td>
            <td><input type="number"></td>
        </tr>
        <tr>
        <td><label for="">Gender</label></td>
        <td><input type="radio" name="Gender" value="Male"><label for="">Male</label>
            <input type="radio" name="Gender" value="Female" ><label for="">Female</label>
            <input type="radio" name="Gender" value="Others"><label for="">Others</label>
        </td>
    </tr>
    <tr>
        <td><label for="">Selec Country</label></td>  
    <td><select name="" id="">
        <option value="INDIA">INDIA</option>
        <option value="USA">USA</option>
        <option value="RUSSIA">RUSSIA</option>
        <option value="UAE">UAE</option>
        

    </select>
    </td>
</tr>
    <tr>
        <td>Upload Picture</td>
    <td><input type="file"></td>
</tr>

</table>
<button type="submit">Login</button>
<h4>Course Details</h4>
<table>
    <tr><td><label for="">Select Course</label></td>
    <td><select name="" id="">
        <option value="Python full stack">Pyrhon full stack</option>
        <option value="Java full stack">Java full stack</option>
        <option value="data analytics"> data analytics</option>
    </select></td>
</tr>
    <tr>
        <td><label for="">Delivery mode</label></td>
        <td><input type="radio" name="Delivery mode" value="ONLINE"><label for="">ONLINE</label>
            <input type="radio" name="Delivery mode" valuie="OFFLINE"><label for="">OFFLINE</label>
        </td>
    </tr>
    <tr>
        <td>
        <label for="">Institute Name</label>
        <input type="text"></td>
        </tr> 
        <tr>
            <td><label for="">Choose Your coding knowledge level:</label></td>
            <td><input type="range" value="1" min="1" max="100"></td>
        </tr> 
        <tr><td>Comments</td>
            <td>
                <textarea rows="6" name="" id=""></textarea>
            </td>
        </tr>
</table>

</form>
    
</body>
</html>
